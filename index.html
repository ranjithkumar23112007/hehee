<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gift for Sister</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="scene">
      <div class="title-wrap">
        <p class="mini-tag">A little surprise</p>
        <h1>For My Sister</h1>
      </div>

      <div class="gift-box" id="giftBox" tabindex="0" role="button" aria-label="Open gift box">
        <div class="lid"></div>
        <div class="box-body">
          <div class="ribbon ribbon-horizontal"></div>
          <div class="ribbon ribbon-vertical"></div>
        </div>

        <div class="ipad-reveal" aria-hidden="true">
          <div class="ipad-body">
            <div class="camera-dot"></div>
            <div class="screen">
              <div class="status-bar">
                <span>9:41</span>
                <div class="status-icons">
                  <span class="signal"></span>
                  <span class="wifi"></span>
                  <span class="battery"></span>
                </div>
              </div>

              <div class="app-grid">
                <div class="app-icon photos"><span>Photo</span></div>
                <div class="app-icon calendar"><span>12</span></div>
                <div class="app-icon notes"><span>📝</span></div>
                <div class="app-icon camera"><span>📷</span></div>
                <div class="app-icon music"><span>🎵</span></div>
                <div class="app-icon clock"><span>◔</span></div>
                <div class="app-icon maps"><span>🗺️</span></div>
                <div class="app-icon mail"><span>✉️</span></div>
                <div class="app-icon settings"><span>⚙️</span></div>
                <div class="app-icon safari"><span>⌘</span></div>
                <div class="app-icon app-store"><span>🛍️</span></div>
                <div class="app-icon reminder"><span>✓</span></div>
              </div>

              <div class="dock">
                <div class="dock-icon phone"><span>📞</span></div>
                <div class="dock-icon mail"><span>✉️</span></div>
                <div class="dock-icon safari"><span>🧭</span></div>
                <div class="dock-icon music"><span>🎵</span></div>
                <div class="dock-icon messages"><span>💬</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <p class="hint" id="hintText">Tap the gift box</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
